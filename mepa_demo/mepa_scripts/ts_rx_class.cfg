# Timestamp Classifier Configuration

enable = 1
pkt_encap_type = MEPA_TS_ENCAP_ETH_IP_PTP
clock_id = 0

# eth_class_conf
eth_class_conf.mac_match_mode = MEPA_TS_ETH_ADDR_MATCH_ANY_UNICAST
eth_class_conf.mac_match_select = MEPA_TS_ETH_MATCH_DEST_ADDR
eth_class_conf.mac_addr = 00:00:00:00:00:02
eth_class_conf.vlan_check = 0
eth_class_conf.vlan_conf.pbb_en = 0
eth_class_conf.vlan_conf.tpid = 0x8100
eth_class_conf.vlan_conf.etype = 0x88F7
eth_class_conf.vlan_conf.num_tag = 2
eth_class_conf.vlan_conf.outer_tag.mode = 0
eth_class_conf.vlan_conf.outer_tag.match.range.lower = 100
eth_class_conf.vlan_conf.outer_tag.match.range.upper = 200
eth_class_conf.vlan_conf.inner_tag.mode = 0
eth_class_conf.vlan_conf.inner_tag.match.value.val = 10
eth_class_conf.vlan_conf.inner_tag.match.value.mask = 0xFFF

# ip_class_conf (IPv4 example)
ip_class_conf.ip_ver = MEPA_TS_IP_VER_4
ip_class_conf.ip_match_mode = MEPA_TS_IP_MATCH_SRC
ip_class_conf.ip_addr.ipv4.addr = 0xC0A80001
ip_class_conf.ip_addr.ipv4.mask = 0xFFFFFF00
# ip_class_conf.ip_addr.ipv6.addr = 0,0,0,0
# ip_class_conf.ip_addr.ipv6.mask = 0,0,0,0
ip_class_conf.udp_sport_en = 1
ip_class_conf.udp_dport_en = 0
ip_class_conf.udp_sport = 319
ip_class_conf.udp_dport = 320

# eth2_class_conf
eth2_class_conf.mac_match_mode = MEPA_TS_ETH_ADDR_MATCH_ANY
eth2_class_conf.mac_match_select = MEPA_TS_ETH_MATCH_NONE
eth2_class_conf.mac_addr = FF:FF:FF:FF:FF:FF
eth2_class_conf.vlan_check = 0
eth2_class_conf.vlan_conf.pbb_en = 0
eth2_class_conf.vlan_conf.tpid = 0x88A8
eth2_class_conf.vlan_conf.etype = 0x0800
eth2_class_conf.vlan_conf.num_tag = 1
eth2_class_conf.vlan_conf.outer_tag.mode = 0
eth2_class_conf.vlan_conf.outer_tag.match.value.val = 20
eth2_class_conf.vlan_conf.outer_tag.match.value.mask = 0xFFF
eth2_class_conf.vlan_conf.inner_tag.mode = 0
eth2_class_conf.vlan_conf.inner_tag.match.value.val = 0
eth2_class_conf.vlan_conf.inner_tag.match.value.mask = 0

# ip2_class_conf (IPv6 example)
ip2_class_conf.ip_ver = MEPA_TS_IP_VER_6
ip2_class_conf.ip_match_mode = MEPA_TS_IP_MATCH_NONE
# ip2_class_conf.ip_addr.ipv4.addr = 0
# ip2_class_conf.ip_addr.ipv4.mask = 0
ip2_class_conf.ip_addr.ipv6.addr = 0x20010DB8,0,0,0
ip2_class_conf.ip_addr.ipv6.mask = 0xFFFFFFFF,0,0,0
ip2_class_conf.udp_sport_en = 0
ip2_class_conf.udp_dport_en = 0
ip2_class_conf.udp_sport = 0
ip2_class_conf.udp_dport = 0

# mpls_class_conf
mpls_class_conf.cw_en = 0
mpls_class_conf.flow_en = 1
mpls_class_conf.stack_depth = 1
mpls_class_conf.stack_ref_point = 0
mpls_class_conf.stack_level.first_lvl.lower = 1000
mpls_class_conf.stack_level.first_lvl.upper = 2000
mpls_class_conf.stack_level.first_lvl.match_mode = 3
mpls_class_conf.stack_level.second_lvl.lower = 0
mpls_class_conf.stack_level.second_lvl.upper = 0
mpls_class_conf.stack_level.second_lvl.match_mode = 0
mpls_class_conf.stack_level.third_lvl.lower = 0
mpls_class_conf.stack_level.third_lvl.upper = 0
mpls_class_conf.stack_level.third_lvl.match_mode = 0
mpls_class_conf.stack_level.fourth_lvl.lower = 0
mpls_class_conf.stack_level.fourth_lvl.upper = 0
mpls_class_conf.stack_level.fourth_lvl.match_mode = 0
